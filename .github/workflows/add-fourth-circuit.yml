name: Add fourth circuit activity
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'chore: add fourth circuit activity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/App.tsx')
          s=p.read_text()
          s=s.replace("import InteractiveActivity from './InteractiveActivity';", "import InteractiveActivity from './InteractiveActivity';\nimport CircuitDrawingActivity from './CircuitDrawingActivity';")
          s=s.replace("'quiz'|'activity'|'practical'|'result'", "'quiz'|'activity'|'practical'|'drawing'|'result'")
          s=s.replace("const[activityScore,setActivityScore]=useState(0);", "const[activityScore,setActivityScore]=useState(0);\n const[drawingScore,setDrawingScore]=useState(0);")
          s=s.replace("setActivityScore(0);setAnswers({});", "setActivityScore(0);setDrawingScore(0);setAnswers({});")
          s=s.replace("if(stage==='result')return <Result knowledge={knowledge} practical={practical} total={total} percentage={percentage} onReset={reset}/>;", "if(stage==='drawing')return <Shell><Header title=\"Final Practical Assembly\"/><CircuitDrawingActivity onFinish={(score)=>{setDrawingScore(score);setStage('result')}}/></Shell>;\n if(stage==='result')return <Result knowledge={knowledge} practical={practical} drawing={drawingScore} total={knowledge+practical+drawingScore} percentage={Math.round((knowledge+practical+drawingScore)/90*100)} onReset={reset}/>;")
          s=s.replace("onFinish:()=>setStage('result')", "onFinish:()=>setStage('drawing')")
          s=s.replace("function Result({knowledge,practical,total,percentage,onReset}", "function Result({knowledge,practical,drawing,total,percentage,onReset}")
          s=s.replace("<div><small>Total</small><b>{total}/70</b></div>", "<div><small>Final assembly</small><b>{drawing}/20</b></div><div><small>Total</small><b>{total}/90</b></div>")
          s=s.replace("grid-template-columns:repeat(3,1fr)", "grid-template-columns:repeat(4,1fr)")
          s=s.replace("<p>{level==='Advanced'?'Strong electrical fundamentals, troubleshooting and practical assembly performance.':'Use the breakdown to identify areas for further technical training.'}</p>", "<p>{level==='Advanced'?'Strong electrical fundamentals, troubleshooting, practical wiring and circuit assembly performance.':drawing<15?'The employee should receive additional circuit assembly practice before independent work.':'Use the breakdown to identify areas for further technical training.'}</p>")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git commit -m "chore: add fourth circuit activity" || exit 0
          git push

name: Wire interactive electrical activity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'auto: interactive activity') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add activity stage to app
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          s = p.read_text()

          if "import InteractiveActivity from './InteractiveActivity';" not in s:
              s = s.replace("import type { Dispatch, ReactNode, SetStateAction } from 'react';", "import type { Dispatch, ReactNode, SetStateAction } from 'react';\nimport InteractiveActivity from './InteractiveActivity';", 1)

          s = s.replace("useState<'quiz'|'practical'|'result'>('quiz')", "useState<'quiz'|'activity'|'practical'|'result'>('quiz')", 1)
          s = s.replace("const[index,setIndex]=useState(0);", "const[index,setIndex]=useState(0);\n const[activityScore,setActivityScore]=useState(0);", 1)
          s = s.replace("connections.length*10+(complete?20:0)-errors*2", "connections.length*10+(complete?20:0)-errors*2+activityScore", 1)
          s = s.replace("setIndex(0);setAnswers({});setTime(600);", "setIndex(0);setActivityScore(0);setAnswers({});setTime(600);", 1)
          s = s.replace("onDone={()=>setStage('practical')}", "onDone={()=>setStage('activity')}", 1)
          marker = "if(stage==='result')return <Result knowledge={knowledge} practical={practical} total={total} percentage={percentage} onReset={reset}/>;"
          replacement = "if(stage==='activity')return <InteractiveActivity onFinish={(score)=>{setActivityScore(score);setStage('practical')}}/>;\n if(stage==='result')return <Result knowledge={knowledge} practical={practical} total={total} percentage={percentage} onReset={reset}/>;"
          if marker not in s:
              raise SystemExit('Result route marker not found')
          s = s.replace(marker, replacement, 1)

          marker_css = "const css=`"
          activity_css = ".activityPage{max-width:1120px;margin:15px auto 0}.activityIntro{display:flex;justify-content:space-between;align-items:flex-end;gap:25px}.activityIntro h1{font-size:44px;line-height:1.05;margin:14px 0;color:#151d2f}.activityIntro h1 span{color:#3863ed}.activityIntro p{color:#68758b;line-height:1.6;margin:0;max-width:760px}.activityProgress{background:#141c2e;color:#fff;border-radius:15px;padding:13px 18px;text-align:center;min-width:90px}.activityProgress b,.activityProgress small{display:block}.activityProgress small{font-size:9px;color:#b9c1d1;margin-top:3px}.activityTrack{height:7px;background:#e5e9f0;border-radius:10px;margin:24px 0}.activityTrack i{display:block;height:100%;background:#3863ed;border-radius:10px;transition:.25s}.activityGrid{display:grid;grid-template-columns:360px 1fr;gap:20px}.activityScenario,.activityQuestion{padding:28px}.scenarioIcon{width:64px;height:64px;display:grid;place-items:center;background:#eef4ff;border-radius:18px;font-size:34px;margin-bottom:22px}.activityScenario h2,.activityQuestion h2{font-size:26px;line-height:1.25;margin:10px 0 14px}.activityScenario>p{color:#68758b;line-height:1.7}.scenarioRule{margin-top:25px;background:#f7f9fd;border:1px solid #e4e9f1;border-radius:13px;padding:14px}.scenarioRule b,.scenarioRule span{display:block}.scenarioRule b{font-size:11px;color:#3863ed}.scenarioRule span{font-size:12px;color:#69768a;margin-top:5px}.activityOptions{display:grid;gap:10px;margin-top:24px}.activityOptions button{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid #dfe5ee;background:#fff;border-radius:13px;padding:14px 15px;color:#172033}.activityOptions button:hover:not(:disabled){border-color:#3863ed;background:#f5f8ff}.activityOptions button b{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:9px;background:#eef2f7}.activityOptions button em{margin-left:auto;font-style:normal;font-size:18px;font-weight:900}.activityOptions button.correct{border-color:#9ad9b4;background:#f0fbf4}.activityOptions button.correct b{background:#dff7e8;color:#16824b}.activityOptions button.wrong{border-color:#f0a4a4;background:#fff5f5}.activityOptions button.wrong b{background:#fee2e2;color:#b91c1c}.activityFeedback{margin-top:16px;padding:14px;border-radius:13px}.activityFeedback.good{background:#eefbf2;border:1px solid #b8e6c7}.activityFeedback.bad{background:#fff5f5;border:1px solid #f1c2c2}.activityFeedback b{font-size:12px}.activityFeedback p{font-size:11px;color:#68758b;line-height:1.55;margin:5px 0 0}.activityActions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;color:#7a8799;font-size:11px;font-weight:700}@media(max-width:850px){.activityIntro{align-items:flex-start}.activityGrid{grid-template-columns:1fr}.activityIntro h1{font-size:36px}}@media(max-width:600px){.activityPage{margin-top:5px}.activityIntro{display:block}.activityProgress{display:inline-block;margin-top:15px}.activityScenario,.activityQuestion{padding:20px}.activityActions{align-items:flex-start;flex-direction:column}.activityActions .primary{width:100%}}"
          if marker_css in s and ".activityPage{" not in s:
              s = s.replace(marker_css, marker_css + activity_css, 1)

          p.write_text(s)
          PY

      - name: Verify frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Commit activity integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git commit -m "auto: interactive activity" || exit 0
          git push

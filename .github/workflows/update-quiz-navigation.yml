name: Update quiz navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-quiz:
    if: ${{ !contains(github.event.head_commit.message, 'auto: quiz navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch quiz UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/App.tsx')
          text = path.read_text()

          quiz = r'''function Quiz({index,setIndex,answers,setAnswers,time,onDone}:{index:number;setIndex:(n:number)=>void;answers:Record<number,string>;setAnswers:Dispatch<SetStateAction<Record<number,string>>>;time:number;onDone:()=>void}){
          const q=questions[index];
          const [skipped,setSkipped]=useState<Record<number,boolean>>({});
          const completed=questions.reduce((n,_,i)=>n+(answers[i]||skipped[i]?1:0),0);
          const remaining=questions.length-completed;
          const mm=String(Math.floor(time/60)).padStart(2,'0');
          const ss=String(time%60).padStart(2,'0');
          const goToNextOpen=(from:number)=>{
            for(let step=1;step<=questions.length;step++){
              const candidate=(from+step)%questions.length;
              if(!answers[candidate]&&!skipped[candidate]){setIndex(candidate);return}
            }
          };
          const chooseAnswer=(value:string)=>{
            setAnswers(a=>({...a,[index]:value}));
            setSkipped(s=>{const next={...s};delete next[index];return next});
          };
          const skipCurrent=()=>{
            setSkipped(s=>({...s,[index]:true}));
            if(index<questions.length-1) setIndex(index+1);
            else goToNextOpen(index);
          };
          const next=()=>{if(index<questions.length-1)setIndex(index+1);else if(remaining===0)onDone();};
          const finish=()=>{if(remaining===0)onDone();};
          return <Shell>
            <Header title="Electrical Fundamentals" timer={`${mm}:${ss}`}/>
            <div className="progress"><i style={{width:`${completed/questions.length*100}%`}}/></div>
            <main className="quiz">
              <section className="card questionCard">
                <div className="meta"><span>Question {index+1} / {questions.length}</span><span>MCQ • 1 point</span></div>
                <div className="questionToolbar">
                  <div><b>Question navigator</b><small>Jump to any question</small></div>
                  <strong>{completed}/{questions.length} completed</strong>
                </div>
                <div className="questionNumbers">
                  {questions.map((_,i)=>{
                    const status=answers[i]?'answered':skipped[i]?'skipped':i===index?'current':'unanswered';
                    return <button key={i} className={`qnum ${status}`} onClick={()=>setIndex(i)} aria-label={`Go to question ${i+1}`} title={`Question ${i+1}`}><b>{i+1}</b>{answers[i]&&<span>✓</span>}{skipped[i]&&!answers[i]&&<span>—</span>}</button>;
                  })}
                </div>
                <div className="questionLegend"><span><i className="legendAnswered"/>Answered</span><span><i className="legendSkipped"/>Skipped</span><span><i className="legendCurrent"/>Current</span><span><i className="legendOpen"/>Not visited</span></div>
                <h2>{q.q}</h2>
                <div className="options">{q.options.map((o,i)=><button key={o} className={answers[index]===o?'selected':''} onClick={()=>chooseAnswer(o)}><b>{String.fromCharCode(65+i)}</b>{o}</button>)}</div>
                <div className="nav">
                  <button disabled={!index} onClick={()=>setIndex(index-1)}>← Previous</button>
                  <div className="navActions">
                    <button className="skipButton" onClick={skipCurrent}>Skip question →</button>
                    {index===questions.length-1&&remaining===0?<button className="primary" onClick={finish}>Finish quiz →</button>:<button className="primary" disabled={index===questions.length-1&&!answers[index]&&!skipped[index]} onClick={next}>{index===questions.length-1?'Review questions →':'Next →'}</button>}
                  </div>
                </div>
                <div className="finishBar"><span>{remaining>0?`${remaining} question${remaining===1?'':'s'} still need an answer or can be skipped.`:'✓ Every question is answered or skipped. You can finish the quiz.'}</span>{remaining===0&&<button onClick={finish}>Finish now</button>}</div>
              </section>
              <aside className="card stages"><b>Assessment</b><p>01 <strong>Fundamentals</strong><small>10 electrical MCQs</small></p><p>02 <strong>Practical wiring</strong><small>Pick, place & connect</small></p><p>03 <strong>Performance report</strong><small>Score & competency</small></p></aside>
            </main>
          </Shell>}
          '''

          pattern = r'function Quiz\([\s\S]*?\nfunction Practical\('
          replacement = quiz + '\nfunction Practical('
          updated, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Quiz function was not found; no changes made')

          css = r'''
          .questionToolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px;padding:13px 15px;background:#f7f9fd;border:1px solid #e4e9f1;border-radius:13px}.questionToolbar b,.questionToolbar small{display:block}.questionToolbar small{font-size:10px;color:#8a95a6;margin-top:3px}.questionToolbar>strong{font-size:11px;color:#3863ed;white-space:nowrap}.questionNumbers{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-bottom:10px}.qnum{position:relative;height:42px;border:1px solid #dce3ed;background:#fff;border-radius:10px;color:#526078;font-weight:800}.qnum:hover{border-color:#3863ed;transform:translateY(-1px)}.qnum.current{border-color:#3863ed;background:#eef4ff;color:#3863ed;box-shadow:0 0 0 2px #3863ed18}.qnum.answered{border-color:#9ad9b4;background:#f0fbf4;color:#16824b}.qnum.skipped{border-color:#f2c66d;background:#fff9eb;color:#9a6800}.qnum.unanswered{background:#fff}.qnum span{position:absolute;right:4px;top:2px;font-size:8px}.questionLegend{display:flex;flex-wrap:wrap;gap:13px;margin:0 0 22px;color:#7b8799;font-size:9px;font-weight:700}.questionLegend span{display:flex;align-items:center;gap:5px}.questionLegend i{display:inline-block;width:9px;height:9px;border-radius:3px;border:1px solid #cbd5e1}.legendAnswered{background:#dff7e8;border-color:#9ad9b4!important}.legendSkipped{background:#fff1c9;border-color:#f2c66d!important}.legendCurrent{background:#dbe8ff;border-color:#3863ed!important}.legendOpen{background:#fff}.navActions{display:flex;gap:9px;align-items:center}.skipButton{border:1px solid #dfe5ee;background:#fff;border-radius:11px;padding:12px 14px;color:#66748a;font-weight:800}.skipButton:hover{border-color:#f0b84b;color:#9a6800;background:#fffaf0}.finishBar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:11px 13px;border-radius:11px;background:#f7f9fc;color:#78859a;font-size:10px}.finishBar button{border:0;background:transparent;color:#3863ed;font-weight:900}.finishBar button:hover{text-decoration:underline}
          '''
          marker = '@media(max-width:950px)'
          if marker not in updated:
              raise SystemExit('CSS media marker not found')
          updated = updated.replace(marker, css + marker, 1)
          path.write_text(updated)
          print('Quiz navigation patch applied')
          PY

      - name: Verify build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git commit -m "auto: quiz navigation" || exit 0
          git push
